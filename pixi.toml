[workspace]
authors = ["Samuel Ibarra <ing.samuelibarra@gmail.com>"]
channels = ["https://prefix.dev/max", "https://prefix.dev/conda-forge"]
name = "motoml"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"
preview = ["pixi-build"]

[package]
name = "motoml"
version = "0.1.0"
description = "TOML Reader for Mojo."

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.host-dependencies]
mojo-compiler = "1.*"

[package.build-dependencies]
mojo-compiler = "1.*"

[package.run-dependencies]
mojo-compiler = "1.*"

[dependencies]
mojo = "1.*"

# [tasks]
# test-reflection = { cmd = "pixi run --manifest-path {{ manifest }} mojo test_reflection.mojo", cwd = "tests", args = [{arg = "manifest", default="pixi.toml"}] }
# test-parser = { cmd = "pixi run --manifest-path {{ manifest }} mojo test_parser.mojo", cwd = "tests", args = [{arg = "manifest", default="pixi.toml"}] }
# tests = [ { task = "test-parser" }, { task = "test-reflection" } ]

[tasks]
# run parser live getting data from stdin
parser = { cmd = "mojo tests/stdin_parser.mojo" }

# Test tasks
test-toml-type= { cmd = "mojo test_toml_type.mojo", cwd = "tests", depends-on = ["package", "move-to-test"] }
test-toml-suite = { cmd = "mojo test_toml_suite.mojo", cwd = "tests", depends-on = ["package", "move-to-test"] }
test-parser = { cmd = "mojo test_parser.mojo", cwd = "tests", depends-on = ["package", "move-to-test"] }
test-comptime-parser = { cmd = "mojo test_comptime_parser.mojo", cwd = "tests", depends-on = ["package", "move-to-test"]  }
test-reflection = { cmd = "mojo test_reflection.mojo", cwd = "tests", depends-on = ["package", "move-to-test"] }

tests = { depends-on = [
  "test-toml-type",
  "test-parser",
  "test-toml-suite",
  "test-comptime-parser",
  "test-reflection",
] }

# Build tasks
build_python = "mojo build src/to_python/parser.mojo --emit shared-lib -o motoml.so"
build = { cmd = "pixi run mojo build stdin_parser.mojo -o ../motoml", cwd = "tests" }
debug_build = { cmd = "pixi run mojo build stdin_parser.mojo -o ../motoml_debug -D LOG=1", cwd = "tests" }
package = "mojo precompile src/ -o motoml.mojoc"
move-to-test = "mv motoml.mojoc tests/motoml.mojoc"
 

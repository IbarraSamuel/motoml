[project]
name = "motoml"
version = "1.3.0"
description = "Toml reader for Mojo."
readme = "README.md"
authors = [{ name = "Samuel Ibarra", email = "ing.samuelibarra@gmail.com" }]
requires-python = ">=3.14"

[project.scripts]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.pixi.workspace]
authors = ["Samuel Ibarra <ing.samuelibarra@gmail.com>"]
channels = ["https://prefix.dev/max-nightly", "https://prefix.dev/conda-forge"]
name = "motoml"
platforms = ["linux-64", "osx-arm64"]
version = "1.3.0"
preview = ["pixi-build"]

[tool.pixi.package]
name = "motoml"
version = "1.3.0"
description = "TOML Reader for Mojo."

[tool.pixi.package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[tool.pixi.package.host-dependencies]
mojo-compiler = "1.3.*"

[tool.pixi.package.build-dependencies]
mojo-compiler = "1.3.*"

[tool.pixi.package.run-dependencies]
mojo-compiler = "1.3.*"

[tool.pixi.dependencies]
mojo = "1.3.*"
# [tasks]
# test-reflection = { cmd = "pixi run --manifest-path {{ manifest }} mojo test_reflection.mojo", cwd = "tests", args = [{arg = "manifest", default="pixi.toml"}] }
# test-parser = { cmd = "pixi run --manifest-path {{ manifest }} mojo test_parser.mojo", cwd = "tests", args = [{arg = "manifest", default="pixi.toml"}] }
# tests = [ { task = "test-parser" }, { task = "test-reflection" } ]

[tool.pixi.tasks]
# run parser live getting data from stdin
parser = { cmd = "uv run mojo tests/stdin_parser.mojo" }

# Test tasks
test-toml-type = { cmd = "uv run mojo test_toml_type.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-toml-suite = { cmd = "uv run mojo test_toml_suite.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-parser = { cmd = "uv run mojo test_parser.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-comptime-parser = { cmd = "uv run mojo test_comptime_parser.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-reflection = { cmd = "uv run mojo test_reflection.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
bench-parser = { cmd = "uv run mojo bench_parser.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }

tests = { depends-on = [
    "test-toml-type",
    "test-parser",
    "test-toml-suite",
    # "test-comptime-parser", # BLOCKED BY ENUMS
    "test-reflection",
] }

# Build tasks
build_python = "uv run mojo build src/to_python/parser.mojo --emit shared-lib -o motoml.so"
build = { cmd = "uv run mojo build stdin_parser.mojo -o ../motoml", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
debug_build = { cmd = "uv run mojo build stdin_parser.mojo -o ../motoml_debug -D LOG=1", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
package = "uv run mojo precompile src/ -o motoml.mojoc"
move-to-test = "mv motoml.mojoc tests/motoml.mojoc"


[project]
name = "motoml"
version = "1.3.0"
description = "Fast, spec-compliant TOML 1.1 parser, lazy view, and serializer for Mojo and Python."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Samuel Ibarra", email = "ing.samuelibarra@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "mojo-compiler>=1.2.0,<2.0.0",
]

[project.optional-dependencies]
mojo = [
    "mojo>=1.2.0,<2.0.0",
]
max = [
    "max-core>=26.0.0",
]
gpu = [
    "max-core>=26.0.0",
]

[build-system]
requires = [
    "hatchling>=1.26",
    "packaging",
    "mojo-compiler>=1.2.0,<2.0.0",
]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "modular-nightly"
url = "https://whl.modular.com/nightly/simple/"

[tool.uv.sources]
mojo-compiler = { index = "modular-nightly" }
mojo = { index = "modular-nightly" }
max = { index = "modular-nightly" }
max-core = { index = "modular-nightly" }
max-mojo-libs = { index = "modular-nightly" }

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["python/motoml"]

[tool.hatch.build.targets.sdist]
include = [
    "/pyproject.toml",
    "/hatch_build.py",
    "/README.md",
    "/LICENSE",
    "/src/**",
    "/gpu/**",
    "/python/**",
]
exclude = [
    "/python/motoml/_motoml.so",
    "**/__pycache__",
    "**/*.mojoc",
]

[dependency-groups]
dev = ["editables>=0.5", "hatchling>=1.26", "packaging"]
test = ["pytest>=8.3.2"]

[tool.pytest.ini_options]
pythonpath = ["python"]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests/python"]

[tool.pixi.workspace]
authors = ["Samuel Ibarra <ing.samuelibarra@gmail.com>"]
channels = ["https://prefix.dev/max-nightly", "https://prefix.dev/conda-forge"]
name = "motoml"
platforms = ["linux-64", "osx-arm64"]
version = "1.3.0"
preview = ["pixi-build"]
channel-priority = "disabled"

[tool.pixi.pypi-options]
extra-index-urls = ["https://whl.modular.com/nightly/simple/"]
no-build-isolation = ["motoml"]

[tool.pixi.package]
name = "motoml"
version = "1.3.0"
description = "TOML Reader for Mojo."

[tool.pixi.package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[tool.pixi.package.host-dependencies]
mojo-compiler = "1.3.*"

[tool.pixi.package.build-dependencies]
mojo-compiler = "1.3.*"

[tool.pixi.package.run-dependencies]
mojo-compiler = "1.3.*"

[tool.pixi.dependencies]
mojo = "1.3.*"

[tool.pixi.feature.gpu.dependencies]
max-core = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
gpu = { features = ["gpu"] }

[tool.pixi.tasks]
# Run parser reading TOML from stdin
parser = { cmd = "uv run mojo tests/stdin_parser.mojo" }

# Test tasks
test-parsing = { cmd = "uv run mojo test_parsing.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-strict-spec = { cmd = "uv run mojo test_strict_spec.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-views-and-types = { cmd = "uv run mojo test_views_and_types.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-reflection = { cmd = "uv run mojo test_reflection.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-reflection-serde = { cmd = "uv run mojo test_reflection_serde.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-comptime = { cmd = "uv run mojo test_comptime.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
test-toml-suite = { cmd = "uv run mojo test_toml_suite.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }

tests = { depends-on = [
    "test-parsing",
    "test-strict-spec",
    "test-views-and-types",
    "test-reflection",
    "test-reflection-serde",
    "test-comptime",
    "test-toml-suite",
] }

# Python extension build & test tasks
build-python = "python -c \"import os, subprocess, sys, tempfile; tmp = tempfile.mkdtemp(prefix='motoml_py_'); lib = os.path.join(os.environ.get('CONDA_PREFIX', ''), 'lib', 'mojo'); gpu = os.path.isfile(os.path.join(lib, 'max.mojoc')) and os.path.isfile(os.path.join(lib, 'layout.mojoc')); subprocess.run(['mojo', 'precompile', 'src/', '-o', os.path.join(tmp, 'motoml.mojoc')], check=True); gpu and subprocess.run(['mojo', 'precompile', 'gpu/', '-I', tmp, '-o', os.path.join(tmp, 'motoml_gpu.mojoc')], check=True); entry = 'python/interop/gpu_entry.mojo' if gpu else 'python/interop/cpu_entry.mojo'; sys.exit(subprocess.call(['mojo', 'build', '-I', tmp, '-I', 'python', entry, '--emit', 'shared-lib', '-o', 'python/motoml/_motoml.so']))\""
test-python = "python -c \"import os, subprocess, sys; lib = os.path.join(os.environ.get('CONDA_PREFIX', ''), 'lib', 'mojo'); gpu = os.path.isfile(os.path.join(lib, 'max.mojoc')) and os.path.isfile(os.path.join(lib, 'layout.mojoc')); extra = ['--extra', 'max'] if gpu else []; sys.exit(subprocess.call(['uv', 'sync', '--no-install-project', *extra, '--group', 'dev', '--group', 'test']) or subprocess.call(['uv', 'run', '--no-build-isolation', '--reinstall-package', 'motoml', *extra, '--group', 'dev', '--group', 'test', 'pytest']))\""

# Benchmarks & fuzzing
bench-parser = { cmd = "uv run mojo bench_compare.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
bench-lazy = { cmd = "uv run mojo bench_lazy.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
bench-generic = { cmd = "uv run mojo bench_lazy_generic.mojo", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
fuzz-lazy = { cmd = "uv run python fuzz_diff.py", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }

# Build tasks
build = { cmd = "uv run mojo build stdin_parser.mojo -o ../motoml", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
debug_build = { cmd = "uv run mojo build stdin_parser.mojo -o ../motoml_debug -D LOG=1", cwd = "tests", depends-on = [
    "package",
    "move-to-test",
] }
package = "uv run mojo precompile src/ -o motoml.mojoc"
move-to-test = "mv motoml.mojoc tests/motoml.mojoc"

[tool.pixi.feature.gpu.tasks]
package-gpu-core = "mojo precompile src/ -o tests/motoml.mojoc"
package-gpu = { cmd = "mojo precompile gpu/ -I tests -o tests/motoml_gpu.mojoc", depends-on = ["package-gpu-core"] }
test-gpu = { cmd = "mojo test_gpu_parsing.mojo", cwd = "tests", depends-on = ["package-gpu"] }
bench-gpu = { cmd = "mojo bench_gpu.mojo", cwd = "tests", depends-on = ["package-gpu"] }
